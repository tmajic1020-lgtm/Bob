<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Staff Map &middot; Central Europe 1936</title>
<style>
/* ===================================================================
   PALETTE. Everything else hangs off these; change one line and the
   whole instrument changes with it.
   =================================================================== */
:root{
  --steel-0:#12160f;        /* deepest shadow, behind everything      */
  --steel-1:#1a1f16;        /* panel body                             */
  --steel-2:#252c1e;        /* raised panel                           */
  --steel-3:#2f3826;        /* highlight edge of a raised panel       */
  --line:#3d4a32;           /* the hairline that makes it equipment   */
  --line-hot:#55663f;
  --bone:#d9d5c2;           /* the text you read                      */
  --bone-dim:#8b9078;       /* the text you glance at                 */
  --amber:#d8a23a;          /* a figure worth noticing                */
  --amber-hot:#f0c24d;
  --rust:#b4482e;           /* a figure that is going wrong           */
  --neon:#7dff5a;           /* selection. Nothing else may use it.    */
  --sea:#0d1b2e;            /* deep navy, stylised, not photographic  */
  --sea-shelf:#132742;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--steel-0)}
body{
  font-family:"DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  color:var(--bone);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ===================================================================
   1. THE TOP STATUS BAR
   A rolled-steel strip: a light edge along the top, a dark one along
   the bottom, and a vertical gradient between them. Three borrowed
   pixels is the entire difference between "a dark div" and "a piece
   of equipment".
   =================================================================== */
#topbar{
  position:fixed;left:0;right:0;top:0;height:54px;z-index:30;
  display:flex;align-items:stretch;gap:0;
  background:linear-gradient(180deg,#2b3324 0%,#1d2417 46%,#161b11 100%);
  border-bottom:1px solid #0a0d07;
  box-shadow:inset 0 1px 0 #43502f, 0 2px 10px rgba(0,0,0,.65);
}
/* the national flag, in a frame that looks screwed to the bar */
#flagbox{
  flex:0 0 auto;width:76px;margin:6px 0 6px 8px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#0e1209,#191f12);
  box-shadow:inset 0 0 0 1px #0a0d07, inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
#flagbox img{width:100%;height:100%;object-fit:cover;display:none}
#flagbox.has img{display:block}
#flagbox.has .ph{display:none}
#flagbox .ph{
  font-size:8px;letter-spacing:1.5px;color:#5c6450;text-align:center;line-height:1.3;
}
/* the four corner rivets */
#flagbox::before,#flagbox::after{
  content:"";position:absolute;width:3px;height:3px;border-radius:50%;
  background:#404a33;box-shadow:0 0 0 1px #0a0d07;
}
#flagbox::before{left:2px;top:2px}
#flagbox::after{right:2px;bottom:2px}

#stats{flex:1 1 auto;display:flex;align-items:center;gap:0;overflow:hidden;padding-left:4px}
.stat{
  display:flex;align-items:center;gap:6px;
  padding:0 13px;height:100%;
  border-right:1px solid rgba(61,74,50,.42);
  white-space:nowrap;cursor:default;
}
.stat:first-child{border-left:1px solid rgba(61,74,50,.42)}
.stat:hover{background:rgba(61,74,50,.14)}
.stat .ico{width:17px;height:17px;flex:0 0 auto;opacity:.92}
.stat .col{display:flex;flex-direction:column;line-height:1.05}
.stat .val{font-size:15px;font-weight:600;letter-spacing:.4px;color:var(--bone)}
.stat .lab{font-size:8.5px;letter-spacing:1.4px;color:var(--bone-dim);text-transform:uppercase}
.stat .val.amber{color:var(--amber)}
.stat .val.rust{color:var(--rust)}
.stat .sub{font-size:10px;color:var(--bone-dim);margin-left:1px}

/* the clock, far right, set into the bar like a fitted instrument */
#clock{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  margin:6px 8px 6px 0;padding:0 14px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#0f1409,#1b2113);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}
#clockface{width:26px;height:26px;flex:0 0 auto}
#clock .time{font-size:16px;font-weight:600;letter-spacing:1px;color:var(--amber)}
#clock .date{font-size:10.5px;letter-spacing:1.6px;color:var(--bone-dim);text-transform:uppercase}
#speed{display:flex;gap:2px;margin-left:4px}
#speed button{
  width:17px;height:17px;padding:0;cursor:pointer;
  background:#171c10;color:var(--bone-dim);
  border:1px solid var(--line);font-size:10px;line-height:1;
}
#speed button:hover{border-color:var(--line-hot);color:var(--bone)}
#speed button.on{background:var(--amber);color:#141a0c;border-color:var(--amber-hot);font-weight:700}

/* ===================================================================
   2. THE MAP
   =================================================================== */
#mapwrap{position:fixed;inset:54px 0 0 0;background:var(--sea-shelf);cursor:grab}
#mapwrap.drag{cursor:grabbing}
#map{display:block;width:100%;height:100%}

/* a vignette, so the eye settles in the middle of the theatre */
#vig{position:fixed;inset:54px 0 0 0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 70% 62% at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.55) 100%);}

/* the readout that follows the cursor */
#tip{
  position:fixed;z-index:20;pointer-events:none;display:none;
  background:rgba(14,18,10,.94);border:1px solid var(--line);
  padding:6px 9px;font-size:11.5px;line-height:1.5;
  box-shadow:0 3px 14px rgba(0,0,0,.7);max-width:230px;
}
#tip b{color:var(--amber);letter-spacing:.6px}
#tip .r{color:var(--bone-dim);font-size:10.5px}

/* bottom-left legend, a tactical clipboard */
#legend{
  position:fixed;left:10px;bottom:10px;z-index:20;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(37,44,30,.94),rgba(20,25,15,.94));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 14px rgba(0,0,0,.6);
  padding:8px 11px;font-size:10.5px;letter-spacing:.7px;color:var(--bone-dim);
}
#legend h4{margin:0 0 6px;font-size:9px;letter-spacing:2px;color:var(--amber);font-weight:600}
#legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
#legend .sw{width:15px;height:10px;border:1px solid rgba(0,0,0,.6);flex:0 0 auto}
#legend .k{color:var(--bone)}
#legend .hint{margin-top:7px;padding-top:6px;border-top:1px solid rgba(61,74,50,.5);font-size:9.5px;color:#6f7660}

/* selected-unit card, bottom right */
#unitcard{
  position:fixed;right:10px;bottom:10px;z-index:20;width:206px;display:none;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(37,44,30,.96),rgba(19,24,14,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 16px rgba(0,0,0,.7);
}
#unitcard.on{display:block}
#unitcard .hd{
  display:flex;align-items:center;gap:8px;padding:7px 9px;
  border-bottom:1px solid var(--line);background:rgba(125,255,90,.07);
}
#unitcard .hd .nm{font-size:12px;letter-spacing:1px;color:var(--neon)}
#unitcard .bd{padding:8px 9px;font-size:11px;line-height:1.7}
#unitcard .ln{display:flex;justify-content:space-between}
#unitcard .ln span:first-child{color:var(--bone-dim);letter-spacing:.7px}
#unitcard .bar{height:5px;background:#10150b;border:1px solid var(--line);margin:3px 0 7px}
#unitcard .bar i{display:block;height:100%;background:var(--amber)}

@media(max-width:1180px){
  .stat{padding:0 9px;gap:5px}
  .stat .ico{width:15px;height:15px}
  .stat .val{font-size:14px}
  .stat .lab{font-size:8px;letter-spacing:1.1px}
  #clock{padding:0 9px;gap:7px}
}
/* the clipboard covers France on a laptop-width window; it is a legend, not
   a reason to hide the map */
@media(max-width:1100px){ #legend{display:none} }
@media(max-width:760px){
  .stat{padding:0 8px;gap:4px}
  .stat .val{font-size:13px}
  .stat .lab{font-size:7.5px;letter-spacing:1px}
  #clock .date{display:none}
  #flagbox{width:54px}
  #legend{display:none}
}
</style>
</head>
<body>

<!-- ============================= TOP BAR ============================= -->
<div id="topbar">
  <div id="flagbox" title="Drop or click to set the national flag">
    <div class="ph">FLAG<br>PLATE</div>
    <img id="flagimg" alt="">
  </div>

  <div id="stats">
    <div class="stat" title="Stability. A country that runs out of it stops being governable.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <path d="M12 3 4 7v6c0 4.4 3.4 7.4 8 8 4.6-.6 8-3.6 8-8V7l-8-4z"/><path d="M9 12l2 2 4-4"/>
      </svg>
      <div class="col"><span class="val" id="vStab">72%</span><span class="lab">Stability</span></div>
    </div>

    <div class="stat" title="Political power. What decisions cost.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 6.5v11M8 9.5h8M8 14.5h8"/>
      </svg>
      <div class="col"><span class="val amber" id="vPP">184</span><span class="lab">Political Pwr</span></div>
    </div>

    <div class="stat" title="War support. How much war the public will take.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <path d="M6 20V9M6 9l6-5 6 5M18 9v11"/><path d="M9.5 20v-6h5v6"/>
      </svg>
      <div class="col"><span class="val" id="vWar">49%</span><span class="lab">War Support</span></div>
    </div>

    <div class="stat" title="Workforce available for mobilisation.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/>
        <circle cx="17" cy="9" r="2.4"/><path d="M15 20c0-2.6 1.6-4.4 3.6-4.4"/>
      </svg>
      <div class="col"><span class="val" id="vMan">1.34M</span><span class="lab">Workforce</span></div>
    </div>

    <div class="stat" title="Industrial capacity: civilian and military factories.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <path d="M3 20V11l5 3V11l5 3V7l8 4v9z"/><path d="M7 20v-3M12 20v-3M17 20v-3"/>
      </svg>
      <div class="col"><span class="val" id="vFac">47</span><span class="lab">Factories</span></div>
    </div>

    <div class="stat" title="World tension. The temperature of the whole map.">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c9b06a" stroke-width="1.6">
        <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.6 5.4 3.6 8.5s-1.2 5.9-3.6 8.5c-2.4-2.6-3.6-5.4-3.6-8.5S9.6 6.1 12 3.5z"/>
      </svg>
      <div class="col"><span class="val" id="vTen">3%</span><span class="lab">World Tension</span></div>
    </div>
  </div>

  <div id="clock">
    <svg id="clockface" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#0c1007" stroke="#3d4a32" stroke-width="1.4"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#242c1c" stroke-width="1"/>
      <g stroke="#6d7659" stroke-width="1.3">
        <path d="M20 4.5v3.4M35.5 20h-3.4M20 35.5v-3.4M4.5 20h3.4"/>
      </g>
      <line id="hHour" x1="20" y1="20" x2="20" y2="12" stroke="#d9d5c2" stroke-width="2" stroke-linecap="round"/>
      <line id="hMin"  x1="20" y1="20" x2="20" y2="8"  stroke="#d8a23a" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="1.7" fill="#d8a23a"/>
    </svg>
    <div>
      <div class="time" id="vTime">12:00</div>
      <div class="date" id="vDate">1 Jan 1936</div>
    </div>
    <div id="speed">
      <button data-s="0" title="Pause">&#10073;&#10073;</button>
      <button data-s="1" class="on" title="Slow">1</button>
      <button data-s="2" title="Fast">2</button>
      <button data-s="3" title="Fastest">3</button>
    </div>
  </div>
</div>

<!-- ============================== MAP =============================== -->
<div id="mapwrap"><canvas id="map"></canvas></div>
<div id="vig"></div>
<div id="tip"></div>

<div id="legend">
  <h4>THEATRE KEY</h4>
  <div id="keyrows"></div>
  <div class="hint">Drag to pan &middot; scroll to zoom &middot; click a counter</div>
</div>

<div id="unitcard">
  <div class="hd"><svg id="ucIco" width="22" height="16" viewBox="0 0 30 20"></svg><span class="nm" id="ucName">&mdash;</span></div>
  <div class="bd">
    <div class="ln"><span>Formation</span><b id="ucType">&mdash;</b></div>
    <div class="ln"><span>Divisions</span><b id="ucStr">&mdash;</b></div>
    <div class="ln"><span>Province</span><b id="ucProv">&mdash;</b></div>
    <div class="ln"><span>Readiness</span><b id="ucRdy">&mdash;</b></div>
    <div class="bar"><i id="ucBar" style="width:0%"></i></div>
    <div class="ln"><span>Supply</span><b id="ucSup">&mdash;</b></div>
  </div>
</div>

const _A64="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
const _A64I=(()=>{const m={};for(let i=0;i<_A64.length;i++)m[_A64[i]]=i;return m;})();
function decRing(str,Q){
  const pts=[];let i=0,x=0,y=0;
  const rd=()=>{let v=0,sh=0,c;do{c=_A64I[str[i++]];v|=(c&31)<<sh;sh+=5;}while(c&32);
                return (v&1)?-(v>>1):(v>>1);};
  while(i<str.length){x+=rd();y+=rd();pts.push([x/Q,y/Q]);}
  return pts;
}
const LAND={};                       /* modern country -> array of rings */
for(const n in ATLAS.c) LAND[n]=ATLAS.c[n].map(r=>decRing(r,ATLAS.q));

/* ===================================================================
   1936 POLITICS, LAID OVER REAL GROUND.
   Most of the theatre is a straight union of modern states, and where
   that is true it is EXACT rather than approximate: Czechoslovakia is
   Czechia plus Slovakia, Yugoslavia is the six republics plus Kosovo,
   Romania in 1936 held Bessarabia so it is Romania plus Moldova.

   Two borders genuinely moved, and only those two are drawn by hand:
   Germany's eastern frontier ran through what is now western Poland,
   and Poland's own eastern frontier ran through what is now western
   Belarus and Ukraine. Those are inland lines, which is the one place
   a hand-drawn boundary can be a few kilometres out without anybody
   being able to tell -- unlike a coast, where everybody can.
   =================================================================== */
const POLITICS = [
  /* the empire, where the wider theatre reaches it: Algeria and Tunisia
     were French soil, Syria and Lebanon French mandates */
  {nat:"FRA", of:["France","Algeria","Tunisia","Morocco","Syria","Lebanon"]},
  {nat:"BEL", of:["Belgium","Luxembourg"]},
  {nat:"HOL", of:["Netherlands"]},
  /* Liechtenstein has been in customs union with Switzerland since 1924 */
  {nat:"SUI", of:["Switzerland","Liechtenstein"]},
  {nat:"AUT", of:["Austria"]},
  {nat:"CZE", of:["Czechia","Slovakia"]},
  /* Ruthenia: Czechoslovakia ran all the way to the Romanian border */
  {nat:"CZE", of:["Ukraine"], only:"ZAKARPATTIA"},
  {nat:"HUN", of:["Hungary"]},
  /* Romania in 1936 held Bessarabia (now Moldova) and northern Bukovina */
  {nat:"ROM", of:["Romania","Moldova"]},
  {nat:"ROM", of:["Ukraine"], only:"BUKOVINA"},
  {nat:"YUG", of:["Slovenia","Croatia","Bosnia and Herz.","Serbia","Montenegro","North Macedonia","Kosovo"]},
  {nat:"ITA", of:["Italy","San Marino"]},
  {nat:"DEN", of:["Denmark","Faeroe Is."]},
  {nat:"SWE", of:["Sweden","\u00c5land"]},
  {nat:"NOR", of:["Norway"]},
  {nat:"FIN", of:["Finland"]},
    /* the 10m set resolves territories the 50m one folded away or dropped:
     Malta and Gibraltar were British, the Channel Islands are Crown
     dependencies, and Akrotiri and the buffer zone are modern artefacts
     of a Cyprus that was a British colony in 1936 */
  {nat:"UK",  of:["United Kingdom","Isle of Man","Cyprus","N. Cyprus","Malta",
                  "Guernsey","Jersey","Akrotiri","Dhekelia",
                  "Cyprus U.N. Buffer Zone"]},
  {nat:"IRE", of:["Ireland"]},
  {nat:"SPA", of:["Spain","Andorra"]},
  {nat:"POR", of:["Portugal"]},
  {nat:"GRE", of:["Greece"]},
  {nat:"BUL", of:["Bulgaria"]},
  {nat:"ALB", of:["Albania"]},
  {nat:"TUR", of:["Turkey"]},
  {nat:"LAT", of:["Latvia"]},
  {nat:"EST", of:["Estonia"]},
  /* Lithuania, less the Vilnius region Poland held until 1939 */
  {nat:"LIT", of:["Lithuania"], not:["VILNIUS"]},
  /* Germany: the Reich, plus the eastern provinces now Polish, plus
     East Prussia -- which the atlas still carries as a Russian ring */
  {nat:"GER", of:["Germany"]},
  {nat:"GER", of:["Poland"], only:"GER_EAST"},
  {nat:"GER", of:["Russia"], only:"EAST_PRUSSIA"},
  {nat:"GER", of:["Poland"], only:"EAST_PRUSSIA"},
  /* Poland: what is left of modern Poland, plus the eastern
     voivodeships now in Belarus and Ukraine, plus Vilnius */
  {nat:"POL", of:["Poland"], not:["GER_EAST","EAST_PRUSSIA"]},
  {nat:"POL", of:["Belarus","Ukraine"], only:"KRESY"},
  {nat:"POL", of:["Lithuania"], only:"VILNIUS"},
  /* and everything east of that is the Soviet Union */
  {nat:"SOV", of:["Georgia"]},
  {nat:"SOV", of:["Belarus"], not:["KRESY"]},
  {nat:"SOV", of:["Ukraine"], not:["KRESY","ZAKARPATTIA","BUKOVINA"]},
  {nat:"SOV", of:["Russia"], not:["EAST_PRUSSIA"]}

/* The clipping regions. Each is a closed polygon, but only its first
   `nb` points are a real frontier -- the rest simply closes the shape
   somewhere harmless, because the polygon is only ever intersected
   with a country whose own coastline already bounds it. Drawing the
   whole polygon as a border was the first version's mistake: it ruled
   straight lines across the middle of Germany and out into the Baltic
   where no frontier was. Only the first `nb` points get stroked.

   Generous on the seaward side on purpose: spilling into the Baltic
   costs nothing once it is intersected with real land, whereas
   falling short would leave a gap along the coast, which shows. */
const REGIONS = {
  /* Pomerania and Silesia: German in 1936, Polish now */
  GER_EAST:{nb:8,p:[[16.35,54.60],[16.45,53.30],[16.20,52.90],[16.00,52.40],
                    [16.30,51.90],[17.00,51.30],[18.00,50.90],[18.45,50.25],
                    [13.0,50.0],[13.0,56.5],[16.3,56.5]]},
  /* East Prussia, which the atlas still carries inside Russia */
  EAST_PRUSSIA:{nb:7,p:[[19.65,54.45],[19.30,53.50],[20.40,53.10],[22.00,53.30],
                        [22.80,54.40],[22.85,55.05],[21.05,55.28],
                        [21.30,55.95],[19.50,55.95]]},
  /* the Kresy: Polish in 1936, Belarusian and Ukrainian now */
  KRESY:{nb:9,p:[[22.10,49.15],[23.00,49.10],[24.20,48.65],[25.00,48.60],
                 [25.30,50.20],[25.80,51.20],[26.40,52.00],[27.00,52.70],
                 [26.70,53.80],
                 [26.60,55.60],[21.50,55.60],[21.50,49.15]]},
  /* Vilnius, held by Poland from 1920 until 1939 */
  VILNIUS:{nb:4,p:[[24.00,54.10],[24.55,55.00],[25.50,55.60],[26.70,55.80],
                   [27.20,53.60],[24.00,53.60]]},
  /* Ruthenia: the eastern tail of Czechoslovakia, Ukrainian now */
  ZAKARPATTIA:{nb:3,p:[[22.10,49.15],[23.00,49.10],[24.20,48.65],
                       [24.60,47.60],[21.80,47.60]]},
  /* northern Bukovina: Romanian in 1936, Ukrainian now */
  BUKOVINA:{nb:2,p:[[24.20,48.65],[26.40,48.60],
                    [26.40,47.60],[24.20,47.60]]}
};
/* ---- making the hand-drawn frontiers look like frontiers ----------
   The six borders that moved in 1936 are hand-placed, and next to
   32,000 points of real coastline a seven-point straight line is
   obvious: the Bohemian border winds through the Ore Mountains while
   Germany's eastern frontier ran dead straight for 200km, which it
   did not.

   These are refined once at load: a Catmull-Rom spline through the
   placed waypoints, then a deterministic fractal displacement
   perpendicular to the line, tapered to nothing at each end so the
   frontier still meets the coast and the tripoints exactly where it
   was put. The displacement is a STYLISATION, not data -- the real
   course of these lines is not something this file has. What it
   claims is only that the border was irregular, which is true of
   every border and truer than a ruler. The same refined points are
   used for the clip as for the stroke, so the colour boundary and the
   drawn line cannot disagree. */
function refineBorder(pts){
  if(pts.length<2) return pts.slice();
  const P=[pts[0],...pts,pts[pts.length-1]];        /* clamped ends */
  const out=[], SEG=14;
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    for(let t=0;t<SEG;t++){
      const u=t/SEG, u2=u*u, u3=u2*u;
      out.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)
      ]);
    }
  }
  out.push(pts[pts.length-1]);
  /* perpendicular wander, two octaves, tapered at both ends */
  const n=out.length, res=[];
  for(let i=0;i<n;i++){
    const a=out[Math.max(0,i-1)], b=out[Math.min(n-1,i+1)];
    let dx=b[0]-a[0], dy=b[1]-a[1];
    const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    const u=i/(n-1), taper=Math.sin(Math.PI*u);        /* 0 at both ends */
    const w=(vnoise(i*0.11+3.7, 1.3)-0.5)*0.055
           +(vnoise(i*0.43-9.1, 8.9)-0.5)*0.022;
    const d=w*taper;
    res.push([out[i][0]-dy*d, out[i][1]+dx*d]);
  }
  return res;
}
/* Replace each region's frontier prefix with its refined course, and
   keep the count so the stroke still knows where the real border ends
   and the closing filler begins. */
for(const nm in REGIONS){
  const R=REGIONS[nm];
  const ref=refineBorder(R.p.slice(0,R.nb));
  R.p=ref.concat(R.p.slice(R.nb));
  R.nb=ref.length;
}

function regionPath(name){
  const r=REGIONS[name].p;
  ctx.beginPath();
  r.forEach((q,i)=>{const t=PX(q[0],q[1]); i?ctx.lineTo(t[0],t[1]):ctx.moveTo(t[0],t[1]);});
  ctx.closePath();
}
/* "not" is the complement of a region, which a canvas clip cannot express
   directly -- so it is drawn as a huge outer rectangle with the region as a
   reversed hole, and filled even-odd. */
function notRegionPath(names){
  ctx.beginPath();
  ctx.moveTo(-1e5,-1e5);ctx.lineTo(1e5,-1e5);ctx.lineTo(1e5,1e5);ctx.lineTo(-1e5,1e5);ctx.closePath();
  for(const n of names){
    REGIONS[n].p.forEach((q,i)=>{const t=PX(q[0],q[1]); i?ctx.lineTo(t[0],t[1]):ctx.moveTo(t[0],t[1]);});
    ctx.closePath();
  }
}

/* The interior lines used to be nine hand-drawn rivers. They are now
   the real borders BETWEEN the modern states a 1936 country is made of
   -- Czechia/Slovakia inside Czechoslovakia, the six republics inside
   Yugoslavia, Bessarabia inside Romania -- which is both accurate and
   free, since the atlas already holds them. */

/* ===================================================================
   RIVERS, LAKES AND CITIES ARE REAL TOO.

   The cities here used to be forty-odd places typed in from memory,
   with coordinates good to about a tenth of a degree -- one of them,
   Lisbon, was in the sea. These come from Natural Earth, which is
   public domain, the same kind of source as the coastlines: real
   positions, real populations, so a marker can be sized by how big
   the place actually was rather than by whether I remembered it.

   Natural Earth is a present-day dataset, so the dozen places whose
   names changed after 1945 are put back -- Koenigsberg, Danzig,
   Breslau, Stettin, Lwow, Memel, Allenstein, Wilno. Only the labels
   are historical; the positions are the data's.

/* The atlas was clipped to a box, and zooming out far enough showed
   that box as a hard rectangle with a grey slab of half-a-country
   beyond it. Rather than fade the edge, the camera is simply not
   allowed to leave the data: the span is capped so the viewport is
   never wider or taller than the box, and the centre is held so its
   edges stay off screen. */
function clampCam(){
  const bw=RB[2]-RB[0], bh=RB[3]-RB[1];
  /* span is measured in degrees of longitude across the viewport,
     before the cos(lat) correction, so convert both ways through kx */
  const k=Math.cos(cam.lat*Math.PI/180);
  cam.span=Math.min(cam.span, bw*k, bh*k*W/H);
  cam.span=Math.max(3, cam.span);

  cam.lon=Math.max(RB[0]+halfLon, Math.min(RB[2]-halfLon, cam.lon));
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=wrap.clientWidth;H=wrap.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  clampCam();
  draw();
}
window.addEventListener("resize",resize);

/* Equirectangular with a cos(lat) correction on x, so Europe is not
   stretched sideways the way a naive lon/lat plot leaves it. */
function kx(){return Math.cos(cam.lat*Math.PI/180);}
function PX(lon,lat){
  const s=W/cam.span;
  return [ (lon-cam.lon)*s*kx() + W/2, -(lat-cam.lat)*s + H/2 ];
}
function INV(x,y){
  const s=W/cam.span;
  return [ (x-W/2)/(s*kx()) + cam.lon, -(y-H/2)/s + cam.lat ];
}

function ringPath(ring){
  ctx.beginPath();
  for(let i=0;i<ring.length;i++){
    const p=PX(ring[i][0],ring[i][1]);
    if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.closePath();
}
function shade(hex,f){
  const v=parseInt(hex.slice(1),16);
  const r=Math.round(((v>>16)&255)*f), g=Math.round(((v>>8)&255)*f), b=Math.round((v&255)*f);
  return "rgb("+Math.min(255,r)+","+Math.min(255,g)+","+Math.min(255,b)+")";
}

let hoverCounter=null, selCounter=null, hoverNat=null;

/* ---- paths over the real atlas -------------------------------- */
function addRing(ring){
  for(let i=0;i<ring.length;i++){
    const p=PX(ring[i][0],ring[i][1]);
    i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
  }
  ctx.closePath();
}
/* one path holding every ring in the theatre */
function allLandPath(){
  ctx.beginPath();
  for(const n in LAND) for(const r of LAND[n]) addRing(r);
}
/* one path holding the modern states a 1936 country is made of */
function entryPath(e){
  ctx.beginPath();
  for(const c of e.of){ const rs=LAND[c]; if(!rs)continue; for(const r of rs) addRing(r); }
}
/* run fn with the drawing confined to a 1936 region, or its complement */
function inRegion(e,fn){
  if(!e.only && !e.not){ fn(); return; }
  ctx.save();
  if(e.only){ regionPath(e.only); ctx.clip(); }
  else      { notRegionPath(e.not); ctx.clip("evenodd"); }
  fn(); ctx.restore();
}
function hex2rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
for(const k in NATIONS) NATIONS[k].rgb=hex2rgb(NATIONS[k].col);
/* The political colour is a TINT ON GROUND. It used to be an opaque
   gradient plus a dark veil, which is why the land measured 20-26
   lightness against the real game's 50-62: the fill was the map. Now
   the terrain underneath carries the brightness and this only colours
   it, pushed toward white the way the real map's pastels are. */
function natFill(e,lit){
  const N=NATIONS[e.nat]; if(!N)return;
  const c=N.rgb, t=0.30;
  const r=(c[0]+(255-c[0])*t)|0, g=(c[1]+(255-c[1])*t)|0, b=(c[2]+(255-c[2])*t)|0;
  ctx.fillStyle="rgba("+r+","+g+","+b+","+(lit?0.62:0.44)+")";
  ctx.fill();
}

/* point-in-polygon on a lon/lat ring */
function inPoly(ring,lon,lat){
  let w=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const a=ring[i],b=ring[j];
    if((a[1]>lat)!==(b[1]>lat) &&
       lon < (b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0]) w=!w;
  }
  return w;
}

/* ===================================================================
   GROUND, NOT FILL.

   The first two versions of this map painted each country a flat
   colour on a navy sea. Measured against a capture of the real game
   at the same zoom, that was wrong in three ways at once, and the
   numbers said so plainly:

                       real game      flat-fill version
     land lightness      50 - 62          20 - 26
     internal detail   0.14 - 0.24      0.03 - 0.07
     sea saturation        0.34            0.67

   Half the brightness, a third of the detail, a sea twice as blue as
   it should be. The real game is a TEXTURED TERRAIN MAP with a pale
   political wash laid over it and a mesh of provinces ruled across
   it; the political colour is a tint on ground, not the ground. So
   the ground is generated here and the nation colour went from an
   opaque fill to a wash over it.
   =================================================================== */

/* value noise: cheap, seeded by position, identical every redraw so
   the terrain does not crawl when the map is panned */
function h2(x,y){
  let n=(x|0)*374761393+(y|0)*668265263;
  n=(n^(n>>13))*1274126177;
  return ((n^(n>>16))>>>0)/4294967296;
}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=h2(xi,yi), b=h2(xi+1,yi), c=h2(xi,yi+1), d=h2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,oct){
  let sum=0, amp=0.5, f=1, norm=0;
  for(let i=0;i<oct;i++){ sum+=amp*vnoise(x*f,y*f); norm+=amp; f*=2; amp*=0.5; }
  return sum/norm;
}
/* Two attempts at "more detail when you zoom in" are recorded here as
   reverted, both for the same reason: there was nothing to fix.

   Raising the fBm persistence moved 96 pixels of 988,000, because over
   a hundredth of a degree the whole field varies by 0.005 and the
   terrain thresholds never notice. Adding colour mottling at a
   zoom-tied frequency then measured very slightly WORSE on every
   figure it touched.

   The reason neither helped is that the premise was wrong. Measured on
   a real close-zoom capture, the game's own close view carries an edge
   density of 0.008 to 0.027 -- and this map's close view was already
   0.017, inside that range. Close ground in this game IS smooth, with
   the detail carried by province lines and coast rather than by
   texture. The target was met before the work started. */

/* The terrain palette. Ground first, politics later. */
const T_LOW=[126,136, 98], T_GRASS=[152,152,112], T_DRY=[186,176,136],
      T_SAND=[205,190,150], T_HILL=[150,143,116], T_ROCK=[170,167,158],
      T_HIGH=[206,205,198];
function mix3(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];}

/* Terrain is baked in SCREEN space at a third of the resolution and
   upscaled. Screen space rather than one fixed geographic texture so
   that zooming in adds octaves instead of magnifying blur -- the map
   keeps its detail at any range, which a pre-baked image cannot do.
   Cached on the camera, because nothing but a pan or a zoom changes it. */
let terrCache=null;
/* ---- where the mountains actually are ----------------------------
   Pure noise gives a continent with no Alps: ridges land wherever the
   hash puts them, which is nowhere in particular, and the eye knows.
   These are the real ranges as polylines, rasterised ONCE into a
   coarse blurred field and then sampled as an elevation bonus during
   the bake. Rasterising through canvas rather than computing distance
   to 60 segments per pixel keeps it to one cheap lookup: at bake
   resolution the per-pixel version would have been tens of millions
   of distance tests. */
const RIDGES=[
  [[6.0,45.2],[7.5,45.9],[9.5,46.5],[11.5,47.1],[13.5,47.2],[15.2,47.3]],   /* Alps        */
  [[-1.7,43.3],[0.5,42.8],[2.6,42.4]],                                      /* Pyrenees    */
  [[18.9,49.5],[21.0,49.3],[23.5,48.2],[25.4,47.6],[26.1,45.6],
   [24.2,45.4],[22.6,45.3]],                                                /* Carpathians */
  [[9.0,44.4],[11.0,43.5],[13.2,42.4],[15.2,40.9],[16.3,39.7]],             /* Apennines   */
  [[14.4,45.5],[16.5,44.1],[18.6,43.0],[20.1,42.0],[21.0,40.5]],            /* Dinarides   */
  [[21.8,43.1],[24.5,42.8],[27.0,42.7]],                                    /* Stara Planina */
  [[6.6,58.4],[8.4,61.0],[12.0,63.4],[15.5,64.4]],                          /* Scandes     */
  [[-6.2,43.1],[-4.2,43.1],[-2.5,42.9]],                                    /* Cantabrians */
  [[-3.2,41.2],[-1.6,40.6],[-0.6,40.2]],                                    /* Iberian sys */
  [[-6.3,37.3],[-3.1,37.1],[-1.8,37.4]],                                    /* Baetic      */
  [[-5.3,57.3],[-3.9,56.8],[-3.2,57.2]],                                    /* Highlands   */
  [[13.0,49.3],[12.3,50.2],[13.5,50.6],[15.3,50.7],[16.6,50.5]],            /* Bohemian rim*/
  [[27.5,37.2],[31.0,36.9],[34.5,37.4],[37.5,38.0]],                        /* Taurus      */
  [[31.0,40.9],[35.0,40.8],[38.5,40.4]],                                    /* Pontics     */
  [[35.5,36.3],[36.4,34.5]],                                                /* Levant      */
  [[-5.5,33.9],[-1.0,34.6],[3.0,35.6],[6.5,36.3]]                           /* Atlas       */
];
const RB=[-11.5,34.0,42.0,64.5];          /* the box the atlas was clipped to */
const RW=640, RH=420;
const RIDGEF=(function(){
  const oc=document.createElement('canvas'); oc.width=RW; oc.height=RH;
  const c=oc.getContext('2d');
  c.fillStyle="#000"; c.fillRect(0,0,RW,RH);
  const P=(lo,la)=>[ (lo-RB[0])/(RB[2]-RB[0])*RW, (RB[3]-la)/(RB[3]-RB[1])*RH ];
  c.lineJoin=c.lineCap="round";
  /* three passes, wide and faint to narrow and bright, so each range
     has foothills falling away from a spine rather than a hard edge */
  for(const [w,a] of [[26,0.30],[14,0.45],[6,0.65]]){
    c.strokeStyle="rgba(255,255,255,"+a+")"; c.lineWidth=w;
    for(const r of RIDGES){
      c.beginPath();
      r.forEach((q,i)=>{const t=P(q[0],q[1]); i?c.lineTo(t[0],t[1]):c.moveTo(t[0],t[1]);});
      c.stroke();
    }
  }
  const d=c.getImageData(0,0,RW,RH).data;
  const f=new Float32Array(RW*RH);
  for(let i=0;i<f.length;i++) f[i]=d[i*4]/255;
  return f;
})();
/* bilinear sample of the ridge field */
function ridgeAt(lon,lat){
  const x=(lon-RB[0])/(RB[2]-RB[0])*RW, y=(RB[3]-lat)/(RB[3]-RB[1])*RH;
  if(x<0||y<0||x>=RW-1||y>=RH-1) return 0;
  const xi=x|0, yi=y|0, xf=x-xi, yf=y-yi;
  const a=RIDGEF[yi*RW+xi],     b=RIDGEF[yi*RW+xi+1];
  const cc=RIDGEF[(yi+1)*RW+xi], dd=RIDGEF[(yi+1)*RW+xi+1];
  return (a+(b-a)*xf)+((cc+(dd-cc)*xf)-(a+(b-a)*xf))*yf;
}

/* Terrain is baked at a third of screen resolution and upscaled.
   Baking at a half when zoomed in was tried, to sharpen the close
   view, and reverted: it changed no measured figure. */
const TERR_SUB=3;
function terrSub(){ return TERR_SUB; }
function terrainBake(lon0,lat0,lon1,lat1,oct){
  const sc=W/cam.span, kxx=kx(), SC=terrSub();
  let tw=Math.ceil((lon1-lon0)*sc*kxx/SC), th=Math.ceil((lat1-lat0)*sc/SC);
  /* keep the bake bounded however far in the camera goes */
  const CAP=900;
  const k=Math.min(1,CAP/Math.max(tw,th)); tw=Math.max(1,Math.round(tw*k)); th=Math.max(1,Math.round(th*k));
  const oc=document.createElement('canvas'); oc.width=tw; oc.height=th;
  const octx=oc.getContext('2d'), img=octx.createImageData(tw,th), d=img.data;
  const dlon=(lon1-lon0)/tw, dlat=(lat1-lat0)/th;
  for(let py=0,i=0;py<th;py++){
    const lat=lat1-py*dlat;
    for(let px=0;px<tw;px++,i+=4){
      const lon=lon0+px*dlon;
      /* elevation is noise PLUS the real ranges; the noise alone put
         mountains nowhere in particular and the eye knew */
      const rg=ridgeAt(lon,lat);
      const e=fbm(lon*1.7+11.3, lat*1.7+ 7.1, oct)*(1-rg*0.45)+rg*0.62;
      const m=fbm(lon*1.1-31.7, lat*1.1+53.9, oct-1);
      const dry=Math.max(0,Math.min(1,(47.5-lat)/13))*0.8 + (1-m)*0.5;
      let col=mix3(T_LOW,T_GRASS,Math.max(0,Math.min(1,dry*1.1)));
      col=mix3(col,T_DRY ,Math.max(0,Math.min(1,(dry-0.55)*2.2)));
      col=mix3(col,T_SAND,Math.max(0,Math.min(1,(dry-0.95)*2.0)));
      col=mix3(col,T_HILL,Math.max(0,Math.min(1,(e-0.56)*3.4))*0.8);
      col=mix3(col,T_ROCK,Math.max(0,Math.min(1,(e-0.70)*4.0)));
      col=mix3(col,T_HIGH,Math.max(0,Math.min(1,(e-0.82)*5.0)));
      /* relief: light from the north-west, which is what makes the
         noise read as ground rather than as static */
      const rx=ridgeAt(lon+dlon,lat), ry=ridgeAt(lon,lat-dlat);
      const ex=fbm((lon+dlon)*1.7+11.3, lat*1.7+7.1, oct)*(1-rx*0.45)+rx*0.62;
      const ey=fbm(lon*1.7+11.3, (lat-dlat)*1.7+7.1, oct)*(1-ry*0.45)+ry*0.62;
      const sh=1+((e-ex)+(e-ey))*2.6;
      d[i  ]=Math.max(0,Math.min(255,col[0]*sh));
      d[i+1]=Math.max(0,Math.min(255,col[1]*sh));
      d[i+2]=Math.max(0,Math.min(255,col[2]*sh));
      d[i+3]=255;
    }
  }
  octx.putImageData(img,0,0);
  return oc;
}
/* Baking the exact viewport meant a 110ms re-bake on every step of a
   drag, which made panning crawl. The projection is linear in lon and
   lat, so a baked rectangle can simply be blitted into whatever screen
   rectangle its corners now land on: bake a rectangle 30% larger than
   the viewport and a pan costs one drawImage until the camera leaves
   it. Only a zoom, which changes the octave count, forces the work. */
function drawTerrain(){
  const a=INV(0,0), b=INV(W,H);
  const lo0=a[0], lo1=b[0], la0=b[1], la1=a[1];
  const oct=Math.max(4,Math.min(9,Math.round(4+Math.log2(34/cam.span))));
  /* Tying the cache to the exact span meant a re-bake on every wheel
     step -- 287ms a frame while zooming. A baked rectangle is just an
     image, and drawImage will rescale it, so a zoom only has to re-bake
     when the octave count changes or when the camera has come in far
     enough that the bake is visibly soft. */
  const ppd=W/cam.span*kx();
  const c=terrCache;
  if(!c || c.oct!==oct || ppd/c.ppd>1.7 ||
     lo0<c.lon0 || lo1>c.lon1 || la0<c.lat0 || la1>c.lat1){
    const mx=(lo1-lo0)*0.30, my=(la1-la0)*0.30;
    const n={lon0:lo0-mx, lon1:lo1+mx, lat0:la0-my, lat1:la1+my, oct:oct, ppd:ppd};
    n.cv=terrainBake(n.lon0,n.lat0,n.lon1,n.lat1,oct);
    /* Compare like with like: the bake is at a third of screen
       resolution, so its screen-equivalent pixels-per-degree is its
       width times the subsampling. Dividing the raw bake width by the
       span instead made this ratio a constant 3 and re-baked every
       frame, which was slower than what it replaced. The cap inside
       the bake can also hand back fewer pixels than were asked for,
       and this accounts for that too. */
    n.ppd=n.cv.width*terrSub()/(n.lon1-n.lon0);
    terrCache=n;
  }
  const t=terrCache;
  const p0=PX(t.lon0,t.lat1), p1=PX(t.lon1,t.lat0);
  ctx.drawImage(t.cv, p0[0], p0[1], p1[0]-p0[0], p1[1]-p0[1]);
}

/* ---- the province mesh -------------------------------------------
   The single most recognisable thing about the real map is that every
   country is ruled into dozens of provinces. A jittered lattice reads
   the same at this scale: lattice vertices on a fixed geographic grid,
   each pushed off its node by a fixed hash, so cells are irregular
   quads that never move between redraws. Fixed in degrees, not in
   pixels, so provinces stay put and get bigger as you come in, the way
   real ones do. */
const PROV_STEP=0.62;
function provV(i,j){
  return [ i*PROV_STEP + (h2(i*7+1,j*13+5)-0.5)*PROV_STEP*0.92,
           j*PROV_STEP + (h2(i*17+9,j*3+41)-0.5)*PROV_STEP*0.92 ];
}
function drawProvinces(s){
  const a=INV(0,0), b=INV(W,H);
  const i0=Math.floor(a[0]/PROV_STEP)-1, i1=Math.ceil(b[0]/PROV_STEP)+1;
  const j0=Math.floor(b[1]/PROV_STEP)-1, j1=Math.ceil(a[1]/PROV_STEP)+1;
  if((i1-i0)*(j1-j0)>30000) return;            /* far out: too dense to read */
  ctx.lineWidth=Math.max(0.5,Math.min(1.1,s*0.030));
  ctx.strokeStyle="rgba(46,42,32,0.34)";
  ctx.beginPath();
  /* Edges are drawn one at a time rather than as full lattice rows so
     that about a fifth can be dropped. A complete lattice reads as
     graph paper; dropping edges merges neighbouring cells into larger
     irregular ones, which is what a province map actually looks like.
     The choice is a hash of the edge, so it never changes. */
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const v=provV(i,j);
    if(h2(i*31+2,j*57+8)>0.20){
      const w=provV(i+1,j), p=PX(v[0],v[1]), q=PX(w[0],w[1]);
      ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]);
    }
    if(h2(i*91+6,j*23+3)>0.20){
      const w=provV(i,j+1), p=PX(v[0],v[1]), q=PX(w[0],w[1]);
      ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]);
    }
  }
  ctx.stroke();
}

/* Where to stamp each country's name. The anchor is the nation's
   single largest modern country, not the union of everything it owns:
   France plus Algeria and Syria has its centre in the Mediterranean,
   which is where the label would have gone. */
const NATBOX={};
(function(){
  const best={};
  for(const e of POLITICS){
    if(!NATIONS[e.nat] || e.only) continue;
    for(const c of e.of){
      const rs=LAND[c]; if(!rs)continue;
      let B=[1e9,1e9,-1e9,-1e9];
      for(const r of rs) for(const q of r){
        B[0]=Math.min(B[0],q[0]);B[1]=Math.min(B[1],q[1]);
        B[2]=Math.max(B[2],q[0]);B[3]=Math.max(B[3],q[1]);
      }
      const area=(B[2]-B[0])*(B[3]-B[1]);
      if(!best[e.nat] || area>best[e.nat].a) best[e.nat]={a:area,B:B};
    }
  }
  for(const k in best) NATBOX[k]=best[k].B;
})();

/* The real map letter-spaces a country's name right across its
   territory in a pale carved capital, and that is most of what makes
   a screenshot read as this game at a glance. */
function polyCentroid(r){
  let a=0,cx=0,cy=0;
  for(let i=0,j=r.length-1;i<r.length;j=i++){
    const f=r[j][0]*r[i][1]-r[i][0]*r[j][1];
    a+=f; cx+=(r[j][0]+r[i][0])*f; cy+=(r[j][1]+r[i][1])*f;
  }
  if(Math.abs(a)<1e-9) return r[0];
  return [cx/(3*a), cy/(3*a)];
}
/* An anchor per nation: the centroid of its largest ring, which for a
   country shaped like Norway or Greece is nowhere near the centre of
   its bounding box. Computed once. */
const NATANCHOR={};
(function(){
  for(const k in NATBOX){
    let big=null,ba=-1;
    for(const e of POLITICS){
      if(e.nat!==k || e.only) continue;
      for(const c of e.of){
        const rs=LAND[c]; if(!rs)continue;
        for(const r of rs){
          let a=0;
          for(let i=0,j=r.length-1;i<r.length;j=i++) a+=r[j][0]*r[i][1]-r[i][0]*r[j][1];
          a=Math.abs(a)/2;
          if(a>ba){ba=a;big=r;}
        }
      }
    }
    if(big){
      const c=polyCentroid(big);
      /* a centroid can fall outside a concave country; fall back to the
         capital, which is at least always on its own soil */
      NATANCHOR[k]= natAt(c[0],c[1])===k ? c : NATIONS[k].cap;
    }
  }
})();

/* The real map letter-spaces a country's name right across its
   territory in a pale carved capital, and that is most of what makes
   a screenshot read as this game at a glance. Labels are placed
   largest-country-first and a later one is dropped if its box would
   collide with one already down, because Greece stamped across Turkey
   reads worse than Greece not stamped at all. */
/* A nation built from several modern countries draws a line wherever two
   of its own entries meet: the Kaliningrad-Poland border ruled straight
   across the middle of East Prussia, and the Oder-Neisse line -- neither
   of which was a frontier in 1936.

   The outward-clip that removes internal edges was being computed from
   ONE entry's countries, so it only knew about edges inside that entry.
   Computed instead from every country the nation holds, an edge between
   two of its entries is interior to the union and its stroke is clipped
   away like any other internal edge. What survives where a region cuts
   a country in half is handled by the explicit region polylines. */
const NATRINGS={};
(function(){
  /* Deduplicate by country. Germany holds parts of Poland under two
     separate entries -- Silesia and East Prussia -- so a naive build put
     Poland's rings in this list TWICE, and under the even-odd rule a
     doubled ring flips parity: Poland counted as INSIDE the clip rather
     than outside it, and the frontier stroke along the Kaliningrad
     border, which should have been discarded as an internal edge,
     survived as a line ruled across the middle of East Prussia. */
  const seen={};
  for(const e of POLITICS){
    if(!NATIONS[e.nat]) continue;
    const acc=NATRINGS[e.nat]||(NATRINGS[e.nat]=[]);
    const got=seen[e.nat]||(seen[e.nat]=new Set());
    for(const c of e.of){
      if(got.has(c)) continue;
      got.add(c);
      const rs=LAND[c]; if(rs) for(const r of rs) acc.push(r);
    }
  }
})();
const CAP36=new Set(Object.values(NATIONS).map(n=>n.capName));
const NATORDER=Object.keys(NATBOX).sort((a,b)=>{
  const A=NATBOX[a],B=NATBOX[b];
  return (B[2]-B[0])*(B[3]-B[1])-(A[2]-A[0])*(A[3]-A[1]);
});
function drawNatNames(s){
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const placed=[];
  for(const k of NATORDER){
    const B=NATBOX[k], N=NATIONS[k]; if(!N)continue;
    const an=NATANCHOR[k]; if(!an)continue;
    const p0=PX(B[0],B[3]), p1=PX(B[2],B[1]);
    const wpx=p1[0]-p0[0], hpx=p1[1]-p0[1];
    if(wpx<150 || hpx<34) continue;
    const nm=N.name.toUpperCase();
    let fs=Math.min(hpx*0.34, wpx/(nm.length*0.95), 68);
    if(fs<11) continue;
    ctx.font="700 "+fs.toFixed(1)+"px 'Roboto Condensed','Arial Narrow',sans-serif";
    ctx.letterSpacing=(fs*0.26).toFixed(1)+"px";
    const a=PX(an[0],an[1]);
    const tw=ctx.measureText(nm).width, th=fs*1.15;
    const box=[a[0]-tw/2, a[1]-th/2, a[0]+tw/2, a[1]+th/2];
    if(box[2]<0||box[0]>W||box[3]<0||box[1]>H){ ctx.letterSpacing="0px"; continue; }
    let hit=false;
    for(const q of placed)
      if(box[0]<q[2]&&box[2]>q[0]&&box[1]<q[3]&&box[3]>q[1]){hit=true;break;}
    if(hit){ ctx.letterSpacing="0px"; continue; }
    placed.push(box);
    ctx.lineWidth=Math.max(2,fs*0.14);
    ctx.strokeStyle="rgba(30,24,16,0.50)"; ctx.strokeText(nm,a[0],a[1]);
    ctx.fillStyle="rgba(250,246,234,0.34)"; ctx.fillText(nm,a[0],a[1]);
    ctx.letterSpacing="0px";
  }
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

/* Lakes are painted in the sea colour so they read as water, and
   rivers over the political wash rather than under it -- a river that
   a country's colour is laid on top of stops looking like water. */
function drawWater(s){
  ctx.save();
  allLandPath(); ctx.clip();
  /* lakes first: a river running into one should stop at its shore */
  ctx.fillStyle="#31435a"; ctx.strokeStyle="rgba(28,40,56,0.55)"; ctx.lineWidth=1;
  const la=INV(0,0), lb=INV(W,H);
  for(const r of LAKES){
    if(r.b[2]<la[0]||r.b[0]>lb[0]||r.b[3]<lb[1]||r.b[1]>la[1]) continue;
    ctx.beginPath(); addRing(r.pts); ctx.fill(); ctx.stroke();
  }
  /* Natural Earth's scalerank: 1 is the Danube, 10 is a tributary that
     only means anything close up. */
  const show = s>46 ? 10 : s>20 ? 8 : s>10 ? 7 : 6;
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="rgba(58,92,124,0.80)";
  const va=INV(0,0), vb=INV(W,H);
  const vx0=va[0], vx1=vb[0], vy0=vb[1], vy1=va[1];
  for(const R of RIVERS){
    const rank=R.rank, pts=R.pts, b=R.b;
    if(rank>show) continue;
    if(b[2]<vx0||b[0]>vx1||b[3]<vy0||b[1]>vy1) continue;
    const w=Math.max(0.6, Math.min(3.2, s*0.055*(1.35-rank*0.085)));
    ctx.lineWidth=w;
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const q=PX(pts[i][0],pts[i][1]);
      i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  const s=W/cam.span;

  /* --- the sea ---------------------------------------------------
     Measured at 0.67 saturation against the real game's 0.34, the old
     navy was twice as blue as the thing it was imitating. This is a
     grey-blue, and lighter. */
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3d5064"); g.addColorStop(.55,"#334457"); g.addColorStop(1,"#2b3a4c");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  /* a faint graticule, the way a staff map is ruled */
  ctx.strokeStyle="rgba(210,225,240,.07)"; ctx.lineWidth=1;
  for(let lon=-10;lon<=40;lon+=5){const a=PX(lon,80),b=PX(lon,20);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  for(let lat=34;lat<=64;lat+=4){const a=PX(-20,lat),b=PX(50,lat);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}

  /* --- land ------------------------------------------------------- */
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=13; ctx.shadowOffsetY=3;
  ctx.fillStyle="#6d7258";
  allLandPath(); ctx.fill();
  ctx.restore();

  /* the generated ground, showing only where there is land */
  ctx.save();
  allLandPath(); ctx.clip();
  drawTerrain();
  ctx.restore();

  /* --- national colour, as a wash over the ground ----------------- */
  for(const e of POLITICS){
    if(!NATIONS[e.nat])continue;
    inRegion(e,()=>{ entryPath(e); natFill(e,hoverNat===e.nat); });
  }

  /* --- water, over the wash so rivers still read as water --------- */
  drawWater(s);

  /* --- provinces, ruled over everything but under the frontiers --- */
  ctx.save();
  allLandPath(); ctx.clip();
  drawProvinces(s);
  ctx.restore();

  /* --- frontiers ---------------------------------------------------
     Stroking a country made of several rings also strokes the borders
     BETWEEN those rings, which would rule a line down the middle of
     Czechoslovakia at full national weight. Clipping to the OUTSIDE of
     the nation before stroking removes them: an internal edge has the
     nation on both sides, so all of its stroke is clipped away, while
     the true boundary keeps its outward half. That leaves the union
     outline -- and unlike filling the path back over the stroke, which
     is how this worked when the fill was opaque, it does not paint out
     the ground and the provinces underneath. */
  ctx.lineJoin="round"; ctx.lineCap="round";
  const fw=Math.max(1.0,Math.min(2.4,s*0.070));
  for(const e of POLITICS){
    if(!NATIONS[e.nat])continue;
    inRegion(e,()=>{
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-1e5,-1e5);ctx.lineTo(1e5,-1e5);ctx.lineTo(1e5,1e5);ctx.lineTo(-1e5,1e5);
      ctx.closePath();
      for(const r of NATRINGS[e.nat]) addRing(r);
      ctx.clip("evenodd");
      entryPath(e);
      ctx.strokeStyle=(hoverNat===e.nat)?"rgba(240,196,86,0.95)":"rgba(58,32,30,0.85)";
      ctx.lineWidth=fw*2; ctx.stroke();
      ctx.restore();
    });
  }

  /* --- the frontiers that are not a modern border ------------------
     Germany's eastern provinces, East Prussia, the Kresy, Vilnius,
     Ruthenia and Bukovina came from a clip, and the clip ate the
     outward half of their stroke. Draw those lines explicitly,
     clipped to land so they do not run out to sea. Only the leading
     `nb` points of each region are a real frontier. */
  ctx.save();
  allLandPath(); ctx.clip();
  ctx.strokeStyle="rgba(58,32,30,0.85)"; ctx.lineWidth=fw;
  for(const nm in REGIONS){
    const R=REGIONS[nm];
    ctx.beginPath();
    for(let i=0;i<R.nb;i++){
      const t=PX(R.p[i][0],R.p[i][1]); i?ctx.lineTo(t[0],t[1]):ctx.moveTo(t[0],t[1]);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* --- country names, stamped across the territory ----------------
     The real map letter-spaces a country's name right across it in a
     pale carved capital. It is most of what makes a screenshot read
     as this game at a glance. */
  drawNatNames(s);

  /* --- cities -----------------------------------------------------
     With 190 real places instead of 40 typed ones, labels collide: at
     country zoom the first version of this produced "Viennaburg" and
     "Luxembourng" where two names overlapped. Each label now reserves
     its box and a later one is dropped rather than drawn through an
     earlier one. CITIES is ordered capitals-first then by population,
     so what survives a collision is the more important place. */
  /* Natural Earth flags present-day capitals, so Zagreb, Bratislava,
     Ljubljana, Sarajevo, Skopje, Pristina, Kiev, Minsk and Kishinev all
     arrived wearing a capital's star. In 1936 every one of them was a
     provincial city of Yugoslavia, Czechoslovakia, the Soviet Union or
     Romania. A star is granted only to the capital of a state that
     existed in 1936, which is exactly the nation table this map paints
     from. */
  const lab=[];
  for(const [nm,lon,lat,,pop] of CITIES){
    const isCap=CAP36.has(nm);
    const p=PX(lon,lat);
    if(p[0]<-60||p[0]>W+60||p[1]<-40||p[1]>H+40)continue;
    /* real populations give something better to thin by than whether I
       happened to type the place in */
    if(!isCap && pop < (s>40?0 : s>20?3e5 : s>11?7e5 : 1.4e6)) continue;
    if(isCap){
      /* a capital glows: a soft halo, then a four-pointed star */
      const r=Math.max(3.4,Math.min(7,s*0.2));
      const hal=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*3.2);
      hal.addColorStop(0,"rgba(240,200,110,0.40)");
      hal.addColorStop(1,"rgba(240,200,110,0)");
      ctx.fillStyle=hal;
      ctx.beginPath();ctx.arc(p[0],p[1],r*3.2,0,6.2832);ctx.fill();
      ctx.beginPath();
      ctx.moveTo(p[0],p[1]-r); ctx.lineTo(p[0]+r*0.30,p[1]-r*0.30);
      ctx.lineTo(p[0]+r,p[1]); ctx.lineTo(p[0]+r*0.30,p[1]+r*0.30);
      ctx.lineTo(p[0],p[1]+r); ctx.lineTo(p[0]-r*0.30,p[1]+r*0.30);
      ctx.lineTo(p[0]-r,p[1]); ctx.lineTo(p[0]-r*0.30,p[1]-r*0.30);
      ctx.closePath();
      ctx.fillStyle="#f4d98a"; ctx.fill();
      ctx.strokeStyle="rgba(40,30,8,.8)"; ctx.lineWidth=0.9; ctx.stroke();
    }else{
      const r=Math.max(1.5,Math.min(3,s*0.075));
      ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.2832);
      ctx.fillStyle="#cfcab4"; ctx.fill();
      ctx.strokeStyle="rgba(10,13,8,.85)"; ctx.lineWidth=1; ctx.stroke();
    }
    const fs=isCap?Math.max(10,Math.min(15,s*0.40)):Math.max(9,Math.min(12,s*0.30));
    ctx.font=(isCap?"600 ":"")+fs+"px 'Roboto Condensed','Arial Narrow',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="bottom";
    const dy=-(isCap?Math.max(7,s*0.28):Math.max(5,s*0.2));
    const tw=ctx.measureText(nm).width;
    const box=[p[0]-tw/2-2, p[1]+dy-fs-1, p[0]+tw/2+2, p[1]+dy+1];
    let hit=false;
    for(const q of lab)
      if(box[0]<q[2]&&box[2]>q[0]&&box[1]<q[3]&&box[3]>q[1]){hit=true;break;}
    if(hit) continue;
    lab.push(box);
    ctx.lineWidth=3; ctx.strokeStyle="rgba(8,11,6,.92)";
    ctx.strokeText(nm,p[0],p[1]+dy);
    ctx.fillStyle=isCap?"#f2e6c2":"#c8c3ad";
    ctx.fillText(nm,p[0],p[1]+dy);
  }

  /* --- counters --------------------------------------------------- */
  for(const c of COUNTERS) drawCounter(c);

  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

/* A counter is a physical chip: national stripe down the left, the
   NATO symbol for what it is in the middle, strength at the right. */
function counterBox(c){
  const p=PX(c.lon,c.lat);
  const s=W/cam.span;
  const w=Math.max(26,Math.min(46,s*1.30)), h=w*0.62;
  return {x:p[0]-w/2, y:p[1]-h/2, w:w, h:h};
}
function drawCounter(c){
  const b=counterBox(c);
  if(b.x+b.w<-20||b.x>W+20||b.y+b.h<-20||b.y>H+20)return;
  const N=NATIONS[c.nat]||{col:"#888"};
  const sel=(selCounter===c), hov=(hoverCounter===c);

  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  const g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);
  g.addColorStop(0,"#2b3324"); g.addColorStop(1,"#161b10");
  ctx.fillStyle=g;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.restore();

  /* national stripe */
  ctx.fillStyle=N.col;
  ctx.fillRect(b.x+1,b.y+1,Math.max(3,b.w*0.13),b.h-2);

  /* NATO symbology: infantry crossed, armour an oval, artillery a
     filled dot, cavalry a single slash. A real-world convention, and
     the reason a counter is readable at this size at all. */
  const ix=b.x+b.w*0.16, iy=b.y+b.h*0.20, iw=b.w*0.50, ih=b.h*0.60;
  ctx.strokeStyle= sel?"#dfffd2":"#cfcab4";
  ctx.lineWidth=Math.max(1,b.w*0.035);
  ctx.beginPath();
  if(c.type==="inf"){
    ctx.moveTo(ix,iy); ctx.lineTo(ix+iw,iy+ih);
    ctx.moveTo(ix+iw,iy); ctx.lineTo(ix,iy+ih);
  }else if(c.type==="arm"){
    ctx.ellipse(ix+iw/2,iy+ih/2,iw*0.48,ih*0.40,0,0,6.2832);
  }else if(c.type==="cav"){
    ctx.moveTo(ix,iy+ih); ctx.lineTo(ix+iw,iy);
  }
  ctx.stroke();
  if(c.type==="art"){
    ctx.beginPath();
    ctx.arc(ix+iw/2,iy+ih/2,Math.max(1.6,b.w*0.075),0,6.2832);
    ctx.fillStyle= sel?"#dfffd2":"#cfcab4"; ctx.fill();
  }

  /* strength */
  const fs=Math.max(9,b.h*0.52);
  ctx.font="700 "+fs+"px 'Roboto Condensed','Arial Narrow',sans-serif";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.fillStyle= sel?"#dfffd2":"#e6e1cb";
  ctx.fillText(String(c.str), b.x+b.w-3, b.y+b.h*0.54);

  /* frame -- neon only when it is the thing you are pointing at */
  if(sel||hov){
    ctx.save();
    ctx.shadowColor="rgba(125,255,90,.75)"; ctx.shadowBlur=sel?11:7;
    ctx.strokeStyle= sel?"#7dff5a":"rgba(125,255,90,.8)";
    ctx.lineWidth=sel?2:1.5;
    ctx.strokeRect(b.x-0.5,b.y-0.5,b.w+1,b.h+1);
    ctx.restore();
  }else{
    ctx.strokeStyle="rgba(8,11,6,.9)"; ctx.lineWidth=1;
    ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);
    ctx.strokeStyle="rgba(255,255,255,.07)";
    ctx.strokeRect(b.x+1.5,b.y+1.5,b.w-3,b.h-3);
  }
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

/* Naming the country under the cursor. The hit test has to agree with
   what was painted, so it asks the same two questions the renderer did:
   which modern state is this point in, and is it inside or outside the
   1936 region that state was split by. */
/* The coastline is simplified to about 600m, so a waterfront city can
   sit a few hundred metres outside its own country's outline --
   Copenhagen is 700m out on the Oresund side. Rather than move the
   data, the hit test is allowed the data's own tolerance: if nothing
   contains the point, try a small ring around it. Anything further
   away than the simplification error is genuinely sea. */
function natAt(lon,lat){
  const hit=natAtExact(lon,lat);
  if(hit) return hit;
  const r=0.012;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const h=natAtExact(lon+Math.cos(a)*r/Math.cos(lat*Math.PI/180), lat+Math.sin(a)*r);
    if(h) return h;
  }
  return null;
}
function natAtExact(lon,lat){
  for(const e of POLITICS){
    if(e.only && !inPoly(REGIONS[e.only].p,lon,lat)) continue;
    if(e.not  && e.not.some(n=>inPoly(REGIONS[n].p,lon,lat))) continue;
    for(const c of e.of){
      const rs=LAND[c]; if(!rs)continue;
      for(const r of rs) if(inPoly(r,lon,lat)) return e.nat;
    }
  }
  return null;
}
function counterAt(x,y){
  for(let i=COUNTERS.length-1;i>=0;i--){
    const b=counterBox(COUNTERS[i]);
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return COUNTERS[i];
  }
  return null;
}

/* ---------------- interaction ---------------- */
let dragging=false,lastX=0,lastY=0,moved=0;
wrap.addEventListener("mousedown",e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;wrap.classList.add("drag");});
window.addEventListener("mouseup",e=>{
  if(dragging&&moved<4){
    const r=cv.getBoundingClientRect();
    const c=counterAt(e.clientX-r.left,e.clientY-r.top);
    selCounter=(c===selCounter)?null:c;
    showCard(selCounter); draw();
  }
  dragging=false;wrap.classList.remove("drag");
});
window.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    moved+=Math.abs(dx)+Math.abs(dy);
    lastX=e.clientX;lastY=e.clientY;
    const s=W/cam.span;
    cam.lon-=dx/(s*kx()); cam.lat+=dy/s;
    clampCam();
    draw(); tip.style.display="none"; return;
  }
  if(x<0||y<0||x>W||y>H){tip.style.display="none";return;}
  const hc=counterAt(x,y);
  const ll=INV(x,y);
  const hn=hc?hc.nat:natAt(ll[0],ll[1]);
  if(hc!==hoverCounter||hn!==hoverNat){hoverCounter=hc;hoverNat=hn;draw();}
  cv.style.cursor=hc?"pointer":"";
  if(hc){
    tip.innerHTML="<b>"+hc.name+"</b><br><span class='r'>"+
      TYPE_NAMES[hc.type]+" &middot; "+hc.str+" division"+(hc.str>1?"s":"")+
      "<br>"+(NATIONS[hc.nat]||{}).name+"</span>";
  }else if(hn){
    const N=NATIONS[hn];
    tip.innerHTML="<b>"+N.name+"</b><br><span class='r'>Capital: "+N.capName+
      "<br>"+ll[1].toFixed(1)+"°N "+Math.abs(ll[0]).toFixed(1)+"°"+(ll[0]<0?"W":"E")+"</span>";
  }else{
    tip.style.display="none";return;
  }
  tip.style.display="block";
  const tw=tip.offsetWidth||170, th=tip.offsetHeight||44;
  tip.style.left=Math.min(window.innerWidth-tw-8,e.clientX+15)+"px";
  tip.style.top=Math.min(window.innerHeight-th-8,e.clientY+16)+"px";
});
wrap.addEventListener("mouseleave",()=>{tip.style.display="none";hoverCounter=hoverNat=null;draw();});
wrap.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const before=INV(e.clientX-r.left,e.clientY-r.top);
  cam.span=cam.span*(e.deltaY>0?1.12:0.89); clampCam();
  const after=INV(e.clientX-r.left,e.clientY-r.top);
  cam.lon+=before[0]-after[0]; cam.lat+=before[1]-after[1];
  draw();
},{passive:false});

/* touch: one finger pans, two pinch */
let pinch=0;
wrap.addEventListener("touchstart",e=>{
  if(e.touches.length===1){dragging=true;moved=0;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  else if(e.touches.length===2){
    pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
wrap.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinch){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    cam.span=cam.span*(pinch/d); clampCam();
    pinch=d; draw(); e.preventDefault(); return;
  }
  if(dragging&&e.touches.length===1){
    const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    const s=W/cam.span;
    cam.lon-=dx/(s*kx()); cam.lat+=dy/s;
    clampCam();
    draw(); e.preventDefault();
  }
},{passive:false});
wrap.addEventListener("touchend",()=>{dragging=false;pinch=0;});

/* the selected-unit card */
function showCard(c){
  const card=document.getElementById("unitcard");
  if(!c){card.classList.remove("on");return;}
  card.classList.add("on");
  document.getElementById("ucName").textContent=c.name;
  document.getElementById("ucType").textContent=TYPE_NAMES[c.type];
  document.getElementById("ucStr").textContent=c.str;
  document.getElementById("ucProv").textContent=(NATIONS[c.nat]||{}).name||"—";
  const rdy=62+((c.str*37+c.lon*11)|0)%36;
  document.getElementById("ucRdy").textContent=rdy+"%";
  document.getElementById("ucBar").style.width=rdy+"%";
  document.getElementById("ucSup").textContent= rdy>80?"Full":rdy>70?"Adequate":"Strained";
  const ico=document.getElementById("ucIco");
  ico.innerHTML='<rect x="1" y="1" width="28" height="18" fill="none" stroke="#7dff5a" stroke-width="1.4"/>'+
    (c.type==="inf"?'<path d="M4 4 L26 16 M26 4 L4 16" stroke="#7dff5a" stroke-width="1.4" fill="none"/>':
     c.type==="arm"?'<ellipse cx="15" cy="10" rx="10" ry="5.5" fill="none" stroke="#7dff5a" stroke-width="1.4"/>':
     c.type==="cav"?'<path d="M4 16 L26 4" stroke="#7dff5a" stroke-width="1.4"/>':
                    '<circle cx="15" cy="10" r="3.4" fill="#7dff5a"/>');
}

/* the flag plate: click to load one of your own */
const fb=document.getElementById("flagbox"), fi=document.getElementById("flagimg");
fb.addEventListener("click",()=>{
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return;
    const rd=new FileReader(); rd.onload=()=>{fi.src=rd.result;fb.classList.add("has");}; rd.readAsDataURL(f); };
  inp.click();
});
["dragover","drop"].forEach(ev=>fb.addEventListener(ev,e=>{
  e.preventDefault();
  if(ev==="drop"&&e.dataTransfer.files[0]){
    const rd=new FileReader(); rd.onload=()=>{fi.src=rd.result;fb.classList.add("has");};
    rd.readAsDataURL(e.dataTransfer.files[0]);
  }
}));

/* ---------------- the clock ---------------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let gameDate=new Date(Date.UTC(1936,0,1,12,0,0)), speed=1;
const SPEED_MS={0:0,1:900,2:380,3:120};
function paintClock(){
  const hh=gameDate.getUTCHours(), mm=gameDate.getUTCMinutes();
  document.getElementById("vTime").textContent=
    String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  document.getElementById("vDate").textContent=
    gameDate.getUTCDate()+" "+MON[gameDate.getUTCMonth()]+" "+gameDate.getUTCFullYear();
  const ha=((hh%12)+mm/60)*30, ma=mm*6;
  const set=(el,ang,len)=>{
    const r=ang*Math.PI/180;
    el.setAttribute("x2",(20+Math.sin(r)*len).toFixed(2));
    el.setAttribute("y2",(20-Math.cos(r)*len).toFixed(2));
  };
  set(document.getElementById("hHour"),ha,8);
  set(document.getElementById("hMin"),ma,12);
}
let acc=0,last=performance.now();
function loop(now){
  const dt=now-last; last=now;
  if(speed>0){
    acc+=dt;
    const step=SPEED_MS[speed];
    while(acc>=step){
      acc-=step;
      gameDate=new Date(gameDate.getTime()+3600*1000);   /* one hour a tick */
      paintClock();
      drift();
    }
  }
  requestAnimationFrame(loop);
}
/* the figures move, slowly, so the bar is alive rather than painted */
let stab=72, pp=184, war=49, man=1.34, fac=47, ten=3;
function drift(){
  pp+=0.08; ten+=0.004; man+=0.0004; stab+=(Math.random()-0.5)*0.05;
  war+=(Math.random()-0.5)*0.04;
  stab=Math.max(0,Math.min(100,stab)); war=Math.max(0,Math.min(100,war));
  ten=Math.min(100,ten);
  const $=id=>document.getElementById(id);
  $("vStab").textContent=Math.round(stab)+"%";
  $("vPP").textContent=Math.floor(pp);
  $("vWar").textContent=Math.round(war)+"%";
  $("vMan").textContent=man.toFixed(2)+"M";
  $("vFac").textContent=fac;
  $("vTen").textContent=Math.round(ten)+"%";
  $("vStab").className="val"+(stab<35?" rust":"");
  $("vWar").className="val"+(war<35?" rust":"");
  $("vTen").className="val"+(ten>50?" rust":ten>20?" amber":"");
}
document.querySelectorAll("#speed button").forEach(b=>{
  b.onclick=()=>{
    speed=+b.dataset.s;
    document.querySelectorAll("#speed button").forEach(x=>x.classList.toggle("on",x===b));
  };
});

paintClock(); drift(); resize(); requestAnimationFrame(loop);
</script>
</body>
